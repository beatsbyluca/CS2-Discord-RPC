name: Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: powershell
        run: .\Build-Installer.ps1
      - name: Verify embedded payload
        shell: powershell
        run: |
          & .\dist\CS2-Discord-RPC-Setup.exe --extract-only .\dist\verify
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          if (-not (Test-Path .\dist\verify\Setup.cmd)) { throw 'Setup.cmd is missing' }
          if ((Get-ChildItem .\dist\verify\assets -File).Count -ne 52) { throw 'Image payload is incomplete' }
          foreach ($path in @('src\tray.ps1', 'src\start.vbs', 'assets\tray.ico', 'start.cmd')) {
            if (-not (Test-Path (Join-Path .\dist\verify $path))) { throw "Missing payload item: $path" }
          }
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          if (-not ($releases | Where-Object { $_.tagName -eq $tag })) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release' }
          }
          gh release upload $tag .\dist\CS2-Discord-RPC-Setup.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer' }
